<header class="profile-header">
  <div class="user-info">
    <img [src]="user?.photoUrl || '/assets/default-avatar.png'" alt="Avatar" class="avatar">
    <div class="texts">
      <h2>{{ user?.nome }}</h2>
      <p>{{ user?.email }}</p>
    </div>
  </div>

  <!-- BOTÃO NOVO AQUI -->
  <button class="btn-add-pet" routerLink="/create-pet">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
    Novo Pet
  </button>
</header>
